[package]
name = "sysaudio-stt-desktop"
version = "0.1.0"
description = "实时识别桌面壳。窗口由 Tauri 承载，识别引擎是 Python 子进程。"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
